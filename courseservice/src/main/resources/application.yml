spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://localhost:5432/udemy_course_db
    username: postgres
    password: postgres
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: udemy.exchange
  queue:
   name: course.queue
  routing:
    key: course.tracking

